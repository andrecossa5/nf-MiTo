<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 580" width="1320" height="580" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>nf-MiTo workflow</title>
  <desc>Metro map of nf-MiTo: three assays (MAESTER, mtscATAC, ReDeeM) from reads to a mitochondrial BAM, then to single-cell allele tables.</desc>

  <rect width="1320" height="580" rx="18" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#1f2933">nf-<tspan fill="#2f7fc1">MiTo</tspan></text>
  <text x="40" y="76" font-size="14" fill="#5b6770">Mitochondrial single-cell lineage tracing: preprocessing</text>

  <!-- stage bands -->
  <rect x="110" y="96" width="590" height="400" rx="14" fill="#f4f6f8"/>
  <rect x="712" y="96" width="498" height="400" rx="14" fill="#f4f6f8"/>
  <text x="128" y="120" font-size="12" font-weight="700" letter-spacing="1" fill="#8895a0">1  READS &#8594; MT BAM</text>
  <text x="730" y="120" font-size="12" font-weight="700" letter-spacing="1" fill="#8895a0">2  MT BAM &#8594; SINGLE-CELL TABLES</text>

  <!-- ===== tracks ===== -->
  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- BAM entry -->
    <path d="M610 96 V160" stroke="#b4bcc3" stroke-dasharray="2 12"/>

    <!-- MAESTER -->
    <path d="M64 290 L120 234 V190 L150 160 H1141 L1206 290" stroke="#e8833a"/>
    <!-- mtscATAC -->
    <path d="M64 290 H1206" stroke="#2f7fc1"/>
    <!-- ReDeeM -->
    <path d="M64 290 L120 346 V390 L150 420 H1141 L1206 290" stroke="#2e9e6b"/>
  </g>

  <!-- ===== stations ===== -->
  <g fill="#ffffff" stroke="#1f2933" stroke-width="3.5">
    <!-- terminals -->
    <circle cx="64" cy="290" r="11"/>
    <circle cx="1206" cy="290" r="11"/>
    <circle cx="610" cy="92" r="9" stroke="#8895a0"/>

    <!-- MAESTER only -->
    <circle cx="260" cy="160" r="9"/>
    <circle cx="420" cy="160" r="9"/>

    <!-- mtscATAC + ReDeeM -->
    <rect x="212" y="278" width="22" height="154" rx="11"/>
    <rect x="352" y="278" width="22" height="154" rx="11"/>
    <rect x="492" y="278" width="22" height="154" rx="11"/>

    <!-- MT BAM: all lines -->
    <rect x="599" y="148" width="22" height="284" rx="11"/>
    <!-- split into batches: all lines -->
    <rect x="779" y="148" width="22" height="284" rx="11"/>

    <!-- per-cell tool -->
    <circle cx="900" cy="160" r="9"/>
    <circle cx="900" cy="290" r="9"/>
    <circle cx="900" cy="420" r="9"/>

    <!-- ReDeeM strand bias -->
    <circle cx="1010" cy="420" r="9"/>

    <!-- collapse: maegatk + mgatk -->
    <rect x="1019" y="148" width="22" height="154" rx="11"/>

    <!-- tables -->
    <rect x="1119" y="148" width="22" height="284" rx="11"/>
  </g>

  <!-- ===== labels ===== -->
  <g font-size="13.5" fill="#1f2933" text-anchor="middle">
    <text x="52" y="334" font-weight="700">FASTQ</text>
    <text x="1206" y="324" font-weight="700">MiTo</text>
    <text x="610" y="80" fill="#5b6770">or BAM input</text>

    <text x="260" y="140">STARsolo</text>
    <text x="420" y="140">Filter MT reads</text>

    <text x="223" y="460">Merge</text>
    <text x="223" y="477">lanes</text>
    <text x="363" y="460">Add cell</text>
    <text x="363" y="477">barcode</text>
    <text x="503" y="460">bwa-mem2</text>
    <text x="503" y="477">MT pairs</text>

    <text x="610" y="460" font-weight="700">MT BAM</text>
    <text x="610" y="477" fill="#5b6770" font-size="12">one per library</text>

    <text x="790" y="460" font-weight="700">Batches</text>
    <text x="790" y="477" fill="#5b6770" font-size="12">of cells</text>

    <text x="900" y="136" font-weight="700" fill="#c4691f">maegatk</text>
    <text x="900" y="266" font-weight="700" fill="#256aa5">mgatk</text>
    <text x="900" y="396" font-weight="700" fill="#257e55">RedeemV consensus</text>
    <text x="900" y="454" fill="#5b6770" font-size="12">one cell at a time</text>

    <text x="1010" y="454">Strand-bias</text>
    <text x="1010" y="471">filter</text>
    <text x="1030" y="136">Collapse</text>

    <text x="1130" y="460" font-weight="700">Allele</text>
    <text x="1130" y="477" font-weight="700">tables</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="14" fill="#1f2933" stroke-linecap="round" stroke-width="8" fill-opacity="1">
    <path d="M40 540 H80" stroke="#e8833a"/>
    <text x="92" y="545" stroke="none"><tspan font-weight="700">MAESTER</tspan>  10x GEX + MT amplicons</text>
    <path d="M360 540 H400" stroke="#2f7fc1"/>
    <text x="412" y="545" stroke="none"><tspan font-weight="700">mtscATAC</tspan>  10x scATAC</text>
    <path d="M640 540 H680" stroke="#2e9e6b"/>
    <text x="692" y="545" stroke="none"><tspan font-weight="700">ReDeeM</tspan>  10x Multiome ATAC</text>
  </g>
</svg>
